[tool.black]
line-length = 88
target-version = ['py37']
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
)
'''

[tool.isort]
line_length = 88
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 2
use_parentheses = true
ensure_newline_before_comments = true
float_to_top = true

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
markers = [
    "slow: mark test as slow to run",
    "integration: mark test as integration test",
]
log_format = "%(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
log_cli_level = "INFO"
minversion = "6.0"
addopts = "-ra -q"
log_cli = true