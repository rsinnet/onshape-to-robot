services:
  ros2:
    image: ros2
    build:
      dockerfile: ros2.dockerfile
    network_mode: host
    environment:
      DISPLAY: $DISPLAY
      ROBOT_PACKAGE: $ROBOT_PACKAGE
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./$ROBOT_PACKAGE:/workspace/src/$ROBOT_PACKAGE:ro
      - ./otr_ros2_entrypoint.sh:/otr_ros2_entrypoint.sh:ro
    entrypoint: ["/bin/bash", "-c", "/otr_ros2_entrypoint.sh"]
  onshape-to-robot:
    image: onshape-to-robot
    build: .
